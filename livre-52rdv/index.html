<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0a0a0d;
        --gold: #ffd79a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }

      /* personnages */
      .char { position: absolute; width: 200px; height: 420px; transform-origin: 50% 100%; }
      .char .float { position: absolute; inset: 0; transform-origin: 50% 60%; }
      .char svg { position: absolute; left: 0; top: 0; width: 200px; height: 420px; overflow: visible; }
      .char .color { opacity: 0; }
      .char .shadow {
        position: absolute; left: 30px; top: 418px; width: 140px; height: 26px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 70%);
      }
      .char .aura {
        position: absolute; left: -160px; top: -60px; width: 520px; height: 560px; border-radius: 50%; opacity: 0;
        background: radial-gradient(ellipse, rgba(255,214,150,.55) 0%, rgba(255,190,120,.18) 40%, rgba(255,190,120,0) 70%);
        mix-blend-mode: screen;
      }

      /* livre */
      .book3d { position: absolute; transform-style: preserve-3d; }
      .book3d .face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; backface-visibility: hidden; }
      .book3d img { display: block; width: 100%; height: 100%; border-radius: 3px 6px 6px 3px; }
      .book3d .hinge {
        position: absolute; left: 0; top: 0; bottom: 0; width: 5%;
        background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.06) 60%, rgba(0,0,0,0));
        border-radius: 3px 0 0 3px;
      }
      .book3d .pages {
        position: absolute; top: 0; height: 100%;
        background: repeating-linear-gradient(90deg, #f4ead9 0 2px, #e2d4bd 2px 3px);
      }

      #grain { position: absolute; left: -100px; top: -100px; width: 1280px; height: 2120px; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 80% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
      }
      #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
      #wipe {
        position: absolute; left: 0; top: 0; width: 1180px; height: 1920px; opacity: 0;
        background:
          linear-gradient(90deg, rgba(0,0,0,.25), rgba(0,0,0,0) 8%, rgba(0,0,0,0) 92%, rgba(0,0,0,.35)),
          repeating-linear-gradient(90deg, #58616c 0 180px, #535b66 180px 186px),
          #58616c;
        box-shadow: 30px 0 60px rgba(0,0,0,.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <radialGradient id="gGhost" cx="38%" cy="28%" r="80%">
            <stop offset="0" stop-color="#26262e" />
            <stop offset=".6" stop-color="#0d0d11" />
            <stop offset="1" stop-color="#050507" />
          </radialGradient>
          <radialGradient id="gSkin" cx="40%" cy="35%" r="70%">
            <stop offset="0" stop-color="#f6d3b8" />
            <stop offset="1" stop-color="#d99f7f" />
          </radialGradient>
          <linearGradient id="gHer" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0c27a" />
            <stop offset="1" stop-color="#c98a45" />
          </linearGradient>
          <linearGradient id="gHim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8fb5a6" />
            <stop offset="1" stop-color="#5b8274" />
          </linearGradient>
          <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.6" />
          </filter>
          <filter id="fSofter" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.4" />
          </filter>
          <filter id="fGrain">
            <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
        </defs>
      </svg>

      <!-- 00-05 cuisine -->
      <div id="s1" class="scene clip" data-start="0" data-duration="5.4" data-track-index="0"><div class="cam" style="width:1760px"></div></div>
      <!-- 05-09 départ -->
      <div id="s2" class="scene clip" data-start="5" data-duration="4.05" data-track-index="1"><div class="cam"></div></div>
      <!-- 09-13 ensemble mais seuls -->
      <div id="s3" class="scene clip" data-start="8.85" data-duration="4.5" data-track-index="2"><div class="cam"></div></div>
      <!-- 13-17 la distance -->
      <div id="s4" class="scene clip" data-start="13" data-duration="4.4" data-track-index="3"><div class="cam"></div></div>
      <!-- 17-27 le livre, la couleur, les retrouvailles -->
      <div id="s5" class="scene clip" data-start="17" data-duration="10.6" data-track-index="4"><div class="cam"></div></div>
      <!-- 27-30 le livre -->
      <div id="s7" class="scene clip" data-start="27.2" data-duration="2.8" data-track-index="5"><div class="cam"></div></div>

      <div id="wipe"></div>
      <svg id="grain" viewBox="0 0 640 1060" preserveAspectRatio="none"><rect width="640" height="1060" filter="url(#fGrain)" /></svg>
      <div id="vignette"></div>
      <div id="black"></div>

      <audio id="music" src="assets/bande-son.wav" data-start="0" data-duration="30" data-volume="1" data-track-index="6"></audio>
    </div>

    <script>
      const DUR = 30;
      let seed = 52;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const $ = (s) => document.querySelector(s);
      function add(parent, css, html = "", cls = "abs") {
        const d = document.createElement("div");
        d.className = cls;
        d.style.cssText = css;
        d.innerHTML = html;
        (typeof parent === "string" ? $(parent) : parent).appendChild(d);
        return d;
      }
      const COVER = "assets/couverture.png";

      // ---------------- personnages ----------------
      const ARM_B = "M126 152 C136 190 142 232 140 284";
      const ARM_F = "M74 152 C64 190 58 232 60 284";
      function figure(kind) {
        const ghostBody = "M72 136 C52 152 42 228 40 298 C38 342 42 372 48 394 Q62 380 76 396 Q91 382 104 398 Q118 382 132 396 Q147 380 160 392 C166 360 164 300 158 240 C152 184 142 152 128 136 Q100 124 72 136 Z";
        const bun = kind === "her" ? `<circle cx="66" cy="58" r="17" fill="url(#gGhost)"/>` : "";
        const ghost = `
          <svg class="ghost" viewBox="0 0 200 420"><g filter="url(#fSoft)" opacity=".95">
            <g class="arm-b"><path d="${ARM_B}" stroke="#0b0b0e" stroke-width="21" stroke-linecap="round" fill="none"/></g>
            <path d="${ghostBody}" fill="url(#gGhost)"/>
            <g class="head">${bun}<rect x="88" y="112" width="24" height="30" rx="10" fill="#0b0b0e"/><circle cx="100" cy="84" r="42" fill="url(#gGhost)"/></g>
            <g class="arm-f"><path d="${ARM_F}" stroke="#0b0b0e" stroke-width="21" stroke-linecap="round" fill="none"/></g>
          </g></svg>`;
        const her = kind === "her";
        const cloth = her ? "url(#gHer)" : "url(#gHim)";
        const sleeve = her ? "#dba45f" : "#73998b";
        const body = her
          ? `<path d="M72 136 C54 152 46 228 44 296 C42 330 44 352 48 368 Q100 384 152 368 C158 340 158 300 154 240 C150 184 140 152 128 136 Q100 124 72 136 Z" fill="${cloth}"/>
             <path d="M48 352 Q100 368 152 352 L152 368 Q100 384 48 368 Z" fill="#c4703f" opacity=".7"/>`
          : `<path d="M58 262 L142 262 L138 366 L106 366 L100 304 L94 366 L62 366 Z" fill="#5a4a40"/>
             <path d="M70 136 C56 150 50 210 52 272 Q100 284 148 272 C150 210 144 150 130 136 Q100 124 70 136 Z" fill="${cloth}"/>`;
        const hair = her
          ? `<circle cx="64" cy="58" r="19" fill="#5b3426"/>
             <path d="M58 96 C50 52 80 34 104 38 C130 40 148 58 143 80 C128 64 104 60 86 70 C76 92 76 122 64 134 C56 122 55 108 58 96 Z" fill="#5b3426"/>`
          : `<path d="M60 82 C58 50 80 38 104 40 C128 42 143 58 141 76 C124 64 96 62 74 70 C68 76 64 84 60 88 Z" fill="#3a2a22"/>`;
        const color = `
          <svg class="color" viewBox="0 0 200 420"><g>
            <g class="arm-b"><path d="${ARM_B}" stroke="${sleeve}" stroke-width="21" stroke-linecap="round" fill="none"/><circle cx="140" cy="290" r="11" fill="url(#gSkin)"/></g>
            <ellipse cx="80" cy="372" rx="17" ry="8" fill="#4a3328"/><ellipse cx="120" cy="372" rx="17" ry="8" fill="#4a3328"/>
            ${body}
            <g class="head"><rect x="90" y="112" width="20" height="30" rx="9" fill="#e2ad8e"/><circle cx="100" cy="84" r="42" fill="url(#gSkin)"/>${hair}
              <ellipse cx="122" cy="96" rx="8" ry="5" fill="#ee9f8c" opacity=".55"/></g>
            <g class="arm-f"><path d="${ARM_F}" stroke="${sleeve}" stroke-width="21" stroke-linecap="round" fill="none"/><circle cx="60" cy="290" r="11" fill="url(#gSkin)"/></g>
          </g></svg>`;
        return `<div class="aura"></div><div class="shadow"></div><div class="float">${ghost}${color}</div>`;
      }
      function makeChar(parent, id, kind, x, feetY, scale, z = 5) {
        const d = add(parent, "", figure(kind), "char");
        d.id = id;
        Object.assign(d.style, { left: x + "px", top: feetY - 420 + "px", zIndex: z });
        gsap.set(d, { scale });
        return d;
      }
      // les rotations des bras et de la tête se font autour de l'épaule / du cou
      const origin = { "arm-b": "126 152", "arm-f": "74 152", head: "100 130" };
      function pose(tl, sel, part, vars, at) {
        tl.to(`${sel} .${part}`, { svgOrigin: origin[part], ...vars }, at);
      }
      function setPose(sel, part, vars) {
        gsap.set(`${sel} .${part}`, { svgOrigin: origin[part], ...vars });
      }
      const SLUMP = { x: 9, y: 16, rotation: 14 };

      // ================= S1 : cuisine =================
      (() => {
        const c = "#s1 .cam";
        add(c, "left:0;top:0;width:1760px;height:1330px;background:linear-gradient(180deg,#4a525c,#5b6470 60%,#505862)");
        add(c, "left:0;top:1330px;width:1760px;height:590px;background:linear-gradient(180deg,#3a4048,#262a30);");
        add(c, "left:0;top:1330px;width:1760px;height:590px;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 158px,#1e2227 158px 162px)");
        add(c, "left:0;top:1310px;width:1760px;height:22px;background:#3f464f;box-shadow:0 6px 14px rgba(0,0,0,.35)");
        // fenêtre + lumière froide
        add(c, "left:150px;top:420px;width:360px;height:470px;border-radius:18px;background:#6f7882;box-shadow:inset 0 0 0 16px #6f7882, 0 18px 40px rgba(0,0,0,.35)");
        add(c, "left:170px;top:440px;width:320px;height:430px;border-radius:8px;background:linear-gradient(180deg,#c3d3e0,#93a8bb)");
        add(c, "left:322px;top:440px;width:16px;height:430px;background:#6f7882");
        add(c, "left:170px;top:648px;width:320px;height:14px;background:#6f7882");
        add(c, "left:120px;top:880px;width:420px;height:26px;border-radius:10px;background:#79828c");
        add(c, "left:140px;top:1330px;width:520px;height:420px;opacity:.16;background:linear-gradient(180deg,#cfe0ee,transparent);clip-path:polygon(10% 0,80% 0,100% 100%,30% 100%)");
        // placards hauts
        for (let i = 0; i < 4; i++) {
          add(c, `left:${640 + i * 160}px;top:380px;width:150px;height:250px;border-radius:14px;background:linear-gradient(160deg,#717a85,#5f6873);box-shadow:0 14px 26px rgba(0,0,0,.3)`);
          add(c, `left:${700 + i * 160}px;top:590px;width:30px;height:8px;border-radius:4px;background:#8d969f`);
        }
        // suspension éteinte
        add(c, "left:1000px;top:0;width:4px;height:250px;background:#2f343a");
        add(c, "left:942px;top:240px;width:120px;height:70px;border-radius:60px 60px 10px 10px;background:linear-gradient(180deg,#666f79,#4c535c)");
        // plan de travail
        add(c, "left:600px;top:1010px;width:700px;height:320px;border-radius:10px;background:linear-gradient(180deg,#59616b,#4b525b)");
        for (let i = 0; i < 4; i++) add(c, `left:${612 + i * 172}px;top:1040px;width:160px;height:270px;border-radius:10px;background:#545c66;box-shadow:inset 0 0 0 3px #4a515a`);
        add(c, "left:585px;top:985px;width:730px;height:34px;border-radius:10px;background:linear-gradient(180deg,#8a939c,#727a83);box-shadow:0 10px 18px rgba(0,0,0,.3)");
        // bouilloire + tasses
        add(c, "left:700px;top:900px;width:96px;height:88px;border-radius:40px 40px 14px 14px;background:linear-gradient(160deg,#9aa2ab,#6b737c)");
        add(c, "left:792px;top:925px;width:30px;height:12px;border-radius:6px;background:#6b737c;transform:rotate(-30deg)");
        add(c, "left:1130px;top:940px;width:46px;height:48px;border-radius:8px 8px 16px 16px;background:#7b838c");
        add(c, "left:1190px;top:948px;width:40px;height:40px;border-radius:8px 8px 14px 14px;background:#6f7780");
        // frigo
        add(c, "left:1360px;top:600px;width:280px;height:730px;border-radius:30px;background:linear-gradient(90deg,#959ea7,#828b94 70%,#727a83);box-shadow:0 20px 50px rgba(0,0,0,.4)");
        add(c, "left:1360px;top:880px;width:280px;height:6px;background:#6c747d");
        add(c, "left:1380px;top:700px;width:12px;height:140px;border-radius:6px;background:#b4bcc4");
        add(c, "left:1380px;top:920px;width:12px;height:180px;border-radius:6px;background:#b4bcc4");
        add(c, "left:1650px;top:900px;width:110px;height:430px;border-radius:12px;background:#535b65");

        makeChar(c, "k-him", "him", 1580, 1268, 0.92, 4);
        makeChar(c, "k-her", "her", 130, 1300, 0.96, 6);
        setPose("#k-him", "head", SLUMP);
        setPose("#k-her", "head", SLUMP);
        gsap.set("#k-him .float", { scaleX: -1 });
      })();

      // ================= S2 : départ =================
      (() => {
        const c = "#s2 .cam";
        add(c, "left:0;top:0;width:1080px;height:1330px;background:linear-gradient(180deg,#434a54,#535b66 60%,#4a525c)");
        add(c, "left:0;top:1330px;width:1080px;height:590px;background:linear-gradient(180deg,#363c44,#22262b)");
        add(c, "left:0;top:1310px;width:1080px;height:22px;background:#3c434b");
        // porte
        add(c, "left:540px;top:600px;width:340px;height:730px;border-radius:14px 14px 0 0;background:#3d444d;box-shadow:0 0 0 18px #616a74, 0 20px 50px rgba(0,0,0,.35)");
        add(c, "left:560px;top:620px;width:300px;height:710px;background:linear-gradient(180deg,#2a2f35,#1b1e22)", "", "abs doorway");
        add(c, "left:560px;top:620px;width:300px;height:710px;perspective:1600px", `
          <div id="door2" style="position:absolute;inset:0;transform-origin:0% 50%;background:repeating-linear-gradient(90deg,#58616c 0 96px,#535b66 96px 100px);border-radius:6px;box-shadow:inset 0 0 0 10px #5f6873">
            <div style="position:absolute;right:28px;top:360px;width:16px;height:46px;border-radius:8px;background:#9aa3ac"></div>
          </div>`);
        // console + bol à clés
        add(c, "left:150px;top:1080px;width:300px;height:26px;border-radius:8px;background:#6c747d;box-shadow:0 10px 20px rgba(0,0,0,.35)");
        add(c, "left:170px;top:1106px;width:14px;height:224px;background:#5c646d");
        add(c, "left:416px;top:1106px;width:14px;height:224px;background:#5c646d");
        add(c, "left:250px;top:1050px;width:90px;height:34px;border-radius:0 0 45px 45px;background:#7d858e");
        add(c, "left:278px;top:1032px;width:40px;height:28px", `<svg id="keysBowl" viewBox="0 0 40 28" width="40" height="28"><circle cx="12" cy="12" r="8" fill="none" stroke="#a8b0b8" stroke-width="3"/><rect x="18" y="10" width="18" height="5" rx="2" fill="#a8b0b8"/></svg>`);
        // patère + manteau
        add(c, "left:200px;top:700px;width:180px;height:14px;border-radius:7px;background:#6c747d");
        add(c, "left:225px;top:712px;width:70px;height:220px;border-radius:30px 30px 20px 20px;background:#4b525b");
        add(c, "left:120px;top:440px;width:180px;height:220px;border-radius:8px;background:#5f6873;box-shadow:inset 0 0 0 12px #6b747e");

        makeChar(c, "h-him", "him", 330, 1300, 0.95, 4);
        makeChar(c, "h-her", "her", -40, 1640, 1.32, 8);
        setPose("#h-him", "head", SLUMP);
        setPose("#h-her", "head", { x: 9, y: 18, rotation: 18 });
        gsap.set("#h-him .float", { scaleX: -1 });
        // clés dans la main (cachées au départ)
        $("#h-him .ghost .arm-b").insertAdjacentHTML("beforeend", `<g class="keys" opacity="0"><circle cx="146" cy="300" r="8" fill="none" stroke="#a8b0b8" stroke-width="3"/><rect x="150" y="304" width="16" height="5" rx="2" fill="#a8b0b8"/></g>`);
      })();

      // ================= S3 : à table, chacun son écran =================
      (() => {
        const c = "#s3 .cam";
        add(c, "left:0;top:0;width:1080px;height:1330px;background:linear-gradient(180deg,#252b36,#323a47 60%,#2b323d)");
        add(c, "left:0;top:1330px;width:1080px;height:590px;background:linear-gradient(180deg,#20252d,#12151a)");
        // fenêtre de nuit
        add(c, "left:720px;top:360px;width:260px;height:380px;border-radius:14px;background:linear-gradient(180deg,#1b2740,#2b3b5c);box-shadow:inset 0 0 0 12px #3e4757");
        add(c, "left:844px;top:360px;width:12px;height:380px;background:#3e4757");
        add(c, "left:880px;top:410px;width:30px;height:30px;border-radius:50%;background:#c9d6e8;box-shadow:0 0 40px 10px rgba(180,200,230,.25)");
        // horloge
        add(c, "left:420px;top:400px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#8b94a1,#6b7480);box-shadow:inset 0 0 0 12px #525b67, 0 14px 30px rgba(0,0,0,.4)", `
          <div style="position:absolute;left:116px;top:50px;width:8px;height:76px;border-radius:4px;background:#2f353d;transform-origin:50% 100%;transform:rotate(300deg)"></div>
          <div style="position:absolute;left:117px;top:70px;width:6px;height:56px;border-radius:3px;background:#2f353d;transform-origin:50% 100%;transform:rotate(60deg)"></div>
          <div id="secHand" style="position:absolute;left:118.5px;top:36px;width:3px;height:90px;background:#3a414a;transform-origin:50% 93%"></div>
          <div style="position:absolute;left:112px;top:112px;width:16px;height:16px;border-radius:50%;background:#2f353d"></div>`);
        // dossiers de chaises
        add(c, "left:200px;top:900px;width:200px;height:330px;border-radius:40px 40px 0 0;background:#3b4350");
        add(c, "left:640px;top:900px;width:200px;height:330px;border-radius:40px 40px 0 0;background:#3b4350");
        makeChar(c, "d-him", "him", 200, 1290, 0.95, 4);
        makeChar(c, "d-her", "her", 650, 1300, 0.9, 4);
        // téléphones + lueurs
        for (const id of ["d-him", "d-her"]) {
          const g = $(`#${id} .ghost g`);
          g.insertAdjacentHTML("beforeend", `<g class="phone"><rect x="84" y="226" width="34" height="58" rx="6" fill="#0b0b0e"/><rect class="scr" x="87" y="230" width="28" height="50" rx="4" fill="#8fc6ff"/><rect class="scroll" x="90" y="236" width="22" height="5" rx="2" fill="#d9eeff"/><rect class="scroll" x="90" y="250" width="16" height="5" rx="2" fill="#d9eeff"/><rect class="scroll" x="90" y="264" width="20" height="5" rx="2" fill="#d9eeff"/></g>`);
          add(`#${id} .float`, "left:-50px;top:110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(120,180,255,.55),rgba(80,140,255,.15) 40%,rgba(80,140,255,0) 68%);mix-blend-mode:screen", "", "abs glow");
          setPose(`#${id}`, "head", { x: 0, y: 22, rotation: 0 });
          setPose(`#${id}`, "arm-f", { rotation: -40 });
          setPose(`#${id}`, "arm-b", { rotation: 40 });
        }
        // table et nappe (devant les personnages)
        add(c, "left:120px;top:1230px;width:840px;height:28px;border-radius:12px;background:linear-gradient(180deg,#56606e,#454e5b);z-index:9;box-shadow:0 10px 20px rgba(0,0,0,.4)");
        add(c, "left:130px;top:1256px;width:820px;height:250px;border-radius:0 0 30px 30px;background:linear-gradient(180deg,#3f4855,#333b47);z-index:9");
        add(c, "left:120px;top:1100px;width:840px;height:200px;z-index:10;background:radial-gradient(ellipse 30% 40% at 30% 70%,rgba(110,170,255,.2),transparent),radial-gradient(ellipse 30% 40% at 70% 70%,rgba(110,170,255,.2),transparent);mix-blend-mode:screen");
      })();
