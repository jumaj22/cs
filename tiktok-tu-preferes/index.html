<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-semibold.ttf"); font-weight: 600; font-style: normal; }
      @font-face { font-family: "Cormorant"; src: url("assets/fonts/cormorant-italic.ttf"); font-weight: 500; font-style: italic; }
      @font-face { font-family: "Noto Color Emoji"; src: url("assets/fonts/NotoColorEmoji.ttf"); }
      :root {
        --cream: #f6ead9;
        --paper: #fffaf3;
        --terra: #94533d;
        --terra-d: #6f3a29;
        --blush: #e9b8a4;
        --ink: #3a2219;
        --sans: "Inter", sans-serif;
        --serif: "Cormorant", Georgia, serif;
        --emoji: "Noto Color Emoji";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); font-family: var(--sans); color: var(--ink); }
      .abs { position: absolute; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .55; }
      .emoji { font-family: var(--emoji); line-height: 1; }

      /* accroche */
      #hook { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-right: 60px; }
      #hook .big { font-weight: 900; font-size: 124px; letter-spacing: -.04em; line-height: 1.08; color: var(--terra); }
      #hook .sub { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 104px; margin-top: 18px; color: var(--ink); }
      #hook .em { font-size: 150px; margin-bottom: 30px; }

      /* questions */
      .pill {
        position: absolute; left: 70px; top: 190px; height: 76px; padding: 0 34px; border-radius: 38px;
        background: var(--ink); color: var(--cream); font-weight: 800; font-size: 34px; letter-spacing: .08em;
        display: flex; align-items: center;
      }
      .count { position: absolute; left: 790px; top: 196px; font-weight: 800; font-size: 40px; color: var(--terra); width: 100px; text-align: right; }
      .card {
        position: absolute; left: 70px; width: 820px; height: 500px; border-radius: 48px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 56px;
      }
      .card.a { top: 330px; background: linear-gradient(160deg, #a7624a, var(--terra) 60%, var(--terra-d)); color: var(--paper); box-shadow: 0 30px 60px rgba(111,58,41,.35); }
      .card.b { top: 1010px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 60px rgba(111,58,41,.18), inset 0 0 0 5px var(--blush); }
      .card .tag { position: absolute; left: 36px; top: 30px; font-weight: 900; font-size: 40px; opacity: .55; }
      .card .emoji { font-size: 150px; margin-bottom: 30px; }
      .card .txt { font-weight: 800; font-size: 60px; line-height: 1.08; letter-spacing: -.02em; }
      .ou {
        position: absolute; left: 400px; top: 850px; width: 180px; height: 180px; border-radius: 50%;
        background: var(--ink); color: var(--cream); display: flex; align-items: center; justify-content: center;
        font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 84px; z-index: 5;
        box-shadow: 0 16px 34px rgba(58,34,25,.35);
      }
      .ring { position: absolute; left: 380px; top: 830px; width: 220px; height: 220px; z-index: 6; transform: rotate(-90deg); }

      /* commentaire */
      #cta { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-right: 60px; }
      #cta .big { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 170px; color: var(--terra); }
      #cta .mid { font-weight: 900; font-size: 60px; letter-spacing: -.03em; margin-top: 10px; }
      #cta .chips { display: flex; gap: 18px; margin-top: 60px; flex-wrap: wrap; justify-content: center; width: 760px; }
      #cta .chip { font-weight: 800; font-size: 44px; padding: 14px 30px; border-radius: 40px; background: var(--paper); box-shadow: inset 0 0 0 4px var(--blush); }

      /* promo */
      #promo { background: radial-gradient(ellipse at 50% 35%, #a8654c, var(--terra) 50%, #5e2f20 100%); color: var(--cream); }
      #promo .q { position: absolute; left: 70px; width: 880px; top: 640px; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 104px; line-height: 1.05; }
      #bookWrap { position: absolute; left: 270px; top: 230px; width: 500px; height: 751px; perspective: 1800px; }
      #book { position: absolute; inset: 0; transform-style: preserve-3d; }
      #book img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px 8px 8px 4px; transform: translateZ(18px); box-shadow: 0 40px 80px rgba(30,10,5,.55); }
      #book .pages { position: absolute; left: 482px; top: 0; width: 36px; height: 100%; transform: rotateY(90deg); background: repeating-linear-gradient(90deg, #f4ead9 0 2px, #e2d4bd 2px 3px); }
      #book .shine { position: absolute; inset: 0; transform: translateZ(19px); overflow: hidden; border-radius: 4px 8px 8px 4px; }
      #book .shine div { position: absolute; top: -10%; left: -60%; width: 35%; height: 120%; opacity: .3; background: linear-gradient(100deg, transparent, #fff 50%, transparent); transform: rotate(10deg); mix-blend-mode: soft-light; }
      .ptitle { position: absolute; left: 70px; width: 880px; top: 1030px; text-align: center; font-family: var(--serif); font-weight: 600; font-size: 74px; line-height: 1.02; }
      .pauthor { position: absolute; left: 70px; width: 880px; top: 1205px; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 50px; opacity: .9; }
      .pline { position: absolute; left: 70px; width: 880px; top: 1290px; text-align: center; font-weight: 700; font-size: 30px; letter-spacing: .22em; opacity: .85; }
      .pbtn {
        position: absolute; left: 215px; top: 1360px; width: 590px; height: 100px; border-radius: 50px;
        background: var(--cream); color: var(--terra-d); font-weight: 900; font-size: 44px; display: flex; align-items: center; justify-content: center; gap: 14px;
        box-shadow: 0 18px 40px rgba(30,10,5,.35);
      }
      .heart { position: absolute; font-size: 70px; opacity: 0; }
      #grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .05; mix-blend-mode: multiply; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35" data-width="1080" data-height="1920">
      <div id="bg" class="full">
        <div class="blob" style="left:-200px;top:-150px;width:700px;height:700px;background:#f2c6b2"></div>
        <div class="blob" style="left:600px;top:500px;width:650px;height:650px;background:#f4d9b8"></div>
        <div class="blob" style="left:-150px;top:1300px;width:800px;height:800px;background:#efc0ab"></div>
      </div>

      <div id="hook" class="full clip" data-start="0" data-duration="2.6" data-track-index="0">
        <div class="em emoji">💑</div>
        <div class="big">TU<br />PRÉFÈRES…</div>
        <div class="sub">version couple</div>
      </div>

      <div id="qs" class="full clip" data-start="2.4" data-duration="24.2" data-track-index="1"></div>

      <div id="cta" class="full clip" data-start="26.4" data-duration="2.2" data-track-index="2">
        <div class="big">Et toi ?</div>
        <div class="mid">Réponds en commentaire <span class="emoji">👇</span></div>
        <div class="chips"><span class="chip">1A</span><span class="chip">2B</span><span class="chip">3A</span><span class="chip">4B</span><span class="chip">5A</span><span class="chip">6B</span></div>
      </div>

      <div id="promo" class="full clip" data-start="28.4" data-duration="6.6" data-track-index="3">
        <div class="q">Et si chaque semaine devenait un nouveau rendez-vous&nbsp;?</div>
        <div id="bookWrap">
          <div id="book">
            <div class="pages"></div>
            <img src="assets/couverture.png" alt="" />
            <div class="shine"><div></div></div>
          </div>
        </div>
        <div class="ptitle">52 rendez-vous<br />pour se redécouvrir</div>
        <div class="pauthor">de Camille Delcourt</div>
        <div class="pline">UN CARNET À REMPLIR À DEUX</div>
        <div class="pbtn">Disponible sur Amazon</div>
      </div>

      <div id="hearts" class="full"></div>
      <svg id="grain" viewBox="0 0 600 1020" preserveAspectRatio="none">
        <filter id="fg"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="600" height="1020" filter="url(#fg)" />
      </svg>

      <audio id="sfx" src="assets/bruitages.wav" data-start="0" data-duration="35" data-volume="1" data-track-index="4"></audio>
    </div>

    <script>
      const QUESTIONS = [
        ["🕯️", "Un dîner aux chandelles à la maison", "🍝", "Un resto surprise en ville"],
        ["🎒", "Un week-end improvisé", "🗺️", "Un voyage préparé ensemble"],
        ["💌", "Des petits mots cachés partout", "🎤", "Une grande déclaration devant tout le monde"],
        ["🎲", "Une soirée jeux de société", "🍿", "Un film sous le plaid"],
        ["🥂", "Revivre votre premier rendez-vous", "🌱", "En inventer un tout nouveau"],
        ["🌅", "Un pique-nique au lever du soleil", "🌙", "Une balade sous les étoiles"],
      ];
      const T0 = 2.5, STEP = 4.0;
      const qs = document.getElementById("qs");
      QUESTIONS.forEach(([ea, ta, eb, tb], i) => {
        const g = document.createElement("div");
        g.className = "full q" + i;
        g.style.opacity = 0;
        g.innerHTML = `
          <div class="pill">TU PRÉFÈRES…</div>
          <div class="count">${i + 1}/6</div>
          <div class="card a"><div class="tag">A</div><div class="emoji">${ea}</div><div class="txt">${ta}</div></div>
          <div class="card b"><div class="tag">B</div><div class="emoji">${eb}</div><div class="txt">${tb}</div></div>
          <div class="ou">ou</div>
          <svg class="ring" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="#e9b8a4" stroke-width="12" stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="0"/></svg>`;
        qs.appendChild(g);
      });
      // cœurs (positions fixes, déterministes)
      const hearts = document.getElementById("hearts");
      const HP = [[140, 1620], [820, 1560], [260, 1760], [700, 1800], [480, 1680], [900, 1720], [80, 1820], [600, 1600]];
      HP.forEach(([x, y]) => {
        const h = document.createElement("div");
        h.className = "heart emoji";
        h.textContent = "❤️";
        h.style.left = x + "px";
        h.style.top = y + "px";
        hearts.appendChild(h);
      });

      const tl = gsap.timeline({ paused: true });

      // fond vivant
      tl.to("#bg .blob:nth-child(1)", { x: 120, y: 80, duration: 35, ease: "sine.inOut" }, 0);
      tl.to("#bg .blob:nth-child(2)", { x: -140, y: 120, duration: 35, ease: "sine.inOut" }, 0);
      tl.to("#bg .blob:nth-child(3)", { x: 160, y: -100, duration: 35, ease: "sine.inOut" }, 0);
      let s = 9;
      const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      for (let t = 0; t < 35; t += 1 / 12) tl.set("#grain", { x: Math.round(r() * 60 - 30), y: Math.round(r() * 60 - 30) }, t);

      // accroche
      tl.from("#hook .big", { scale: 0.6, opacity: 0, duration: 0.45, ease: "back.out(1.8)" }, 0.1);
      tl.from("#hook .em", { y: 60, opacity: 0, duration: 0.4, ease: "back.out(2)" }, 0.5);
      tl.from("#hook .sub", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.75);
      tl.to("#hook .big", { scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);
      tl.to("#hook", { opacity: 0, scale: 0.92, duration: 0.25, ease: "power2.in" }, 2.3);
      document.querySelectorAll("#hearts .heart").forEach((h, i) => {
        tl.fromTo(h, { opacity: 0, y: 0, scale: 0.4 }, { opacity: 1, y: -260 - (i % 3) * 80, scale: 1, duration: 1.1, ease: "power2.out" }, 0.85 + i * 0.08);
        tl.to(h, { opacity: 0, duration: 0.35 }, 1.95 + i * 0.05);
      });

      // questions
      QUESTIONS.forEach((_, i) => {
        const t = T0 + i * STEP;
        const q = `#qs .q${i}`;
        tl.set(q, { opacity: 1 }, t - 0.05);
        tl.from(`${q} .pill, ${q} .count`, { y: -30, opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        tl.from(`${q} .card.a`, { x: -1000, rotation: -6, duration: 0.45, ease: "back.out(1.3)" }, t + 0.05);
        tl.from(`${q} .card.b`, { x: 1000, rotation: 6, duration: 0.45, ease: "back.out(1.3)" }, t + 0.2);
        tl.from(`${q} .ou`, { scale: 0, duration: 0.35, ease: "back.out(2.5)" }, t + 0.45);
        tl.from(`${q} .ring`, { opacity: 0, duration: 0.2 }, t + 0.6);
        tl.to(`${q} .ring circle`, { attr: { "stroke-dashoffset": 628.3 }, duration: 2.8, ease: "none" }, t + 0.6);
        tl.to(`${q} .ou`, { scale: 1.12, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1 }, t + 0.9);
        tl.to(`${q} .ou`, { scale: 1.12, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1 }, t + 1.9);
        tl.to(`${q} .ou`, { scale: 1.12, duration: 0.12, ease: "power1.out", yoyo: true, repeat: 1 }, t + 2.9);
        tl.to(`${q} .card`, { scale: 1.04, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, t + 3.4);
        tl.to(`${q} .card.a`, { x: -1100, rotation: -5, duration: 0.3, ease: "power2.in" }, t + 3.7);
        tl.to(`${q} .card.b`, { x: 1100, rotation: 5, duration: 0.3, ease: "power2.in" }, t + 3.7);
        tl.to(`${q} .ou, ${q} .ring, ${q} .pill, ${q} .count`, { opacity: 0, duration: 0.2 }, t + 3.75);
        tl.set(q, { opacity: 0 }, t + 4.0);
      });

      // appel aux commentaires
      tl.from("#cta .big", { scale: 0.5, opacity: 0, duration: 0.4, ease: "back.out(2)" }, 26.45);
      tl.from("#cta .mid", { y: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, 26.7);
      tl.from("#cta .chip", { scale: 0, duration: 0.3, ease: "back.out(2.5)", stagger: 0.07 }, 27.0);
      tl.to("#cta", { opacity: 0, duration: 0.2 }, 28.35);

      // promo livre
      tl.fromTo("#promo", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: 0.6, ease: "power2.inOut" }, 28.4);
      tl.from("#promo .q", { y: 50, opacity: 0, duration: 0.5, ease: "power3.out" }, 28.8);
      tl.to("#promo .q", { y: -40, opacity: 0, duration: 0.35, ease: "power2.in" }, 30.0);
      tl.fromTo("#bookWrap", { y: 160, opacity: 0, scale: 0.85 }, { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, 30.2);
      tl.fromTo("#book", { rotationY: -38, rotationX: 6 }, { rotationY: -14, rotationX: 2, duration: 4.8, ease: "power2.out" }, 30.2);
      tl.fromTo("#book .shine div", { x: 0 }, { x: 900, duration: 1.2, ease: "sine.inOut" }, 30.9);
      tl.from(".ptitle", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 30.9);
      tl.from(".pauthor", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, 31.3);
      tl.from(".pline", { opacity: 0, duration: 0.4 }, 31.6);
      tl.from(".pbtn", { scale: 0.4, opacity: 0, duration: 0.45, ease: "back.out(2.2)" }, 32.0);
      tl.to(".pbtn", { scale: 1.05, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 32.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
